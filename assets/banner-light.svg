<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="蜗牛 · cleversnail · 全栈工程师，做 AI 应用与 Web 全栈">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#e8f5fe"/><stop offset="0.5" stop-color="#c3e4f9"/><stop offset="1" stop-color="#94d1f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0369a1" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="10" fill="none" stroke="rgba(2,132,199,0.22)" stroke-width="2"/>

  <!-- 同心圆：整体提高不透明度，保证在渐变两端都看得见 -->
  <g fill="none" stroke="#0369a1" stroke-width="2.5">
    <circle cx="980" cy="150" r="48"  stroke-opacity="0.62"/>
    <circle cx="980" cy="150" r="90"  stroke-opacity="0.42"/>
    <circle cx="980" cy="150" r="132" stroke-opacity="0.26"/>
  </g>
  <circle cx="980" cy="102" r="8" fill="#0369a1" fill-opacity="0.95"/>
  <circle cx="890" cy="150" r="7" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-opacity="0.95"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" fill="#0c4a6e">
    <text x="80" y="124" font-size="78" font-weight="700" letter-spacing="2">蜗牛</text>
    <text x="80" y="172" font-size="27" font-weight="500" letter-spacing="3" fill="#075985">cleversnail</text>
  </g>
  <!-- 独立强调条（下移，不再像"下划线没对齐"） -->
  <rect x="80" y="198" width="80" height="4" rx="2" fill="#0284c7"/>
  <text x="80" y="248" font-size="28" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" fill="#0c4a6e">全栈工程师 · AI 应用与 Web 全栈</text>
</svg>
